name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: 后端（Java 21 · Spring Boot 4）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify = compile + test + package。
      # test 阶段只跑纯单测——pom 已配置 excludedGroups=integration，
      # @SpringBootTest 集成测试（需 MySQL/Milvus/API Key）自动跳过，CI 零外部依赖
      - name: 编译 + 单元测试 + 打包
        run: chmod +x mvnw && ./mvnw -B verify

  frontend:
    name: 前端（Vue 3 · Vite）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build
