# RocketMQ Broker config for docker-compose.prod.yml (app runs INSIDE the docker network)
# The ONLY key difference vs dev (broker.conf): brokerIP1 = service name, resolved
# via Docker DNS. Registering 127.0.0.1 here would make the app container loop back
# to itself. Symptom of a wrong copy: host producer works, in-container consumer
# never receives anything.
# NOTE: keep this file ASCII-only - CJK comments break RocketMQ 5.x startup (NPE).

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

brokerIP1 = rocketmq-broker
listenPort = 10911

# cleanup: drop expired store files at 04:00, keep 48h
deleteWhen = 04
fileReservedTime = 48

# auto create topic on demand (disable in real prod for permission control)
autoCreateTopicEnable = true
