# RocketMQ Broker config for local dev (mounted by docker-compose.yml)
# brokerIP1 is the key: it is the address the Broker registers to NameServer,
# and consumers connect to whatever is registered. The Spring Boot app runs on
# the HOST, so it must be host-reachable: 127.0.0.1 + compose port mapping.
# Full Chinese explanation lives in docker-compose.yml comments.
# NOTE: keep this file ASCII-only - CJK comments break RocketMQ 5.x startup (NPE).

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

brokerIP1 = 127.0.0.1
listenPort = 10911

# cleanup: drop expired store files at 04:00, keep 48h (dev only)
deleteWhen = 04
fileReservedTime = 48

# auto create topic on demand (dev convenience; disable in real prod)
autoCreateTopicEnable = true
