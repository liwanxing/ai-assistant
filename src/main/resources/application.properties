spring.application.name=liwanxing-learning-projects

# 环境配置：dev 开发 / prod 线上
# 开发时默认 dev，线上启动时加 --spring.profiles.active=prod 覆盖
spring.profiles.active=dev

spring.datasource.url=jdbc:mysql://localhost:3306/liwx_learning?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.liwx.learning.entity
mybatis.configuration.map-underscore-to-camel-case=true
