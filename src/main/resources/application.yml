spring:
  application:
    name: liwanxing-learning-projects

  # 环境配置：dev 开发 / prod 线上
  # 开发时默认 dev，线上启动时加 --spring.profiles.active=prod 覆盖
  profiles:
    active: dev

  # Spring AI：用 OpenAI 兼容协议接通义 DashScope（chat + embedding 都走这个）
  # key 直接写在配置里（私有项目，不上传公开仓库；用完学习后记得去百炼控制台作废）
  ai:
    openai:
      api-key: sk-ws-H.ERXIMXH.Emll.MEUCIG2go4uaGbfIC1Bmw4OInOjmm6_Dk8bTM2lanIYI89s2AiEA4lEjLfvczCKIByy9cOxpPU6rF3BpJ51uc72Sz3vhRuo
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        model: qwen-plus            # 通义对话模型

  # MySQL 数据源
  datasource:
    # allowPublicKeyRetrieval=true：MySQL 8.0 默认用 caching_sha2_password 认证，需要这个参数才能连上
    url: jdbc:mysql://localhost:3306/liwx_learning?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis（Sa-Token 的 token 存到这里）
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456

# Sa-Token 配置
sa-token:
  token-name: satoken
  timeout: 2592000        # token 有效期 30 天（秒）
  is-concurrent: true      # 允许同一账号多设备同时登录
  is-share: false          # 不同设备生成不同的 token

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.liwx.learning.user.entity
  configuration:
    map-underscore-to-camel-case: true
