spring:
  application:
    name: liwanxing-learning-projects

  # 文件上传限制：默认 1MB，PDF/Word 文档通常较大，调到 50MB
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # 环境配置：dev 开发 / prod 线上
  # 开发时默认 dev，线上启动时加 --spring.profiles.active=prod 覆盖
  profiles:
    active: dev

  # 导入本地敏感配置（不上传 git），文件不存在也不报错（optional）
  # 本地开发时在项目根目录放 application-local.yml，里面写真实的 API Key
  # 线上部署时用环境变量注入，不需要这个文件
  config:
    import: "optional:file:./application-local.yml"

  # Spring AI：用 OpenAI 兼容协议接通义 DashScope（chat + embedding 都走这个）
  # key 用占位符，真实值在 application-local.yml 或环境变量里
  #
  # 切换模型只需改下面的 model 名，不用动 Java 代码：
  #   qwen-plus → 通义千问、deepseek-r1 → DeepSeek、gpt-4o → OpenAI
  #   换平台还要改 base-url 和 api-key
  # AiConfig 里的 ChatClient.Builder 会自动读取这里的配置
  ai:
    openai:
      api-key: ${AI_API_KEY:sk-placeholder}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        model: qwen-plus            # 通义对话模型
      embedding:
        model: text-embedding-v3    # 通义向量模型，把文本转成向量（1024维）
    # ChatMemory 对话记忆：对话历史自动存 MySQL（SPRING_AI_CHAT_MEMORY 表）
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always  # MySQL 不是嵌入式数据库，默认不建表，必须设为 always
    # MCP Client：连接远程 MCP Server，自动发现对方暴露的工具（如经营分析工具）
    # toolcallback.enabled = true 把 MCP 工具自动注册到 ChatClient，和本地 @Tool 工具并列
    # request-timeout 设 2 分钟：经营分析内部多次调 LLM，响应通常 20-30 秒
    #
    # enabled 是 MCP 客户端总开关，默认关闭：避免强依赖 graph-learning-java 项目（MCP Server 没启动会连接失败）
    # 需要联调 MCP 工具时，启动前设环境变量 MCP_ENABLED=true 即可
    mcp:
      client:
        enabled: ${MCP_ENABLED:false}
        toolcallback:
          enabled: true
        request-timeout: 120s
        sse:
          connections:
            graph-analysis:                          # 连接名，随便取
              url: ${MCP_SERVER_URL:http://localhost:8081}  # 对方的 MCP Server 地址

      # MCP Server：把本项目的 RAG 知识库暴露成标准 MCP 工具（扫描 RagMcpTools 的 @McpTool）
      # 与上面的 client 共存：本项目既消费别人的 MCP 工具，也对外提供自己的 MCP 工具
      server:
        enabled: true
        name: liwx-learning-mcp-server      # MCP Server 名称，客户端工具列表里显示的名字
        version: 0.0.1
        type: SYNC                          # 同步服务器：工具方法是阻塞式，与 WebMVC 线程模型匹配
        # STREAMABLE：新版 MCP 传输标准（HTTP POST + 可选 SSE 下行），取代旧 SSE 传输（旧方式每个客户端长占一个连接，太耗服务器资源）
        # Claude Desktop / Cursor 等主流客户端均已支持
        protocol: STREAMABLE
        # 注解扫描：自动发现 @Component 里带 @McpTool 注解的方法并注册为 MCP 工具
        annotation-scanner:
          enabled: true
        streamable-http:
          mcp-endpoint: /mcp                # MCP 端点，外部客户端连接 http://<host>:8080/mcp

    # Langfuse：LLM 可观测性平台，追踪每次 ChatClient 调用（输入/输出/token/延迟）
    # 本地开发用 application-local.yml 里的真实 Key，线上用环境变量注入
    langfuse:
      enabled: ${LANGFUSE_ENABLED:false}
      secret-key: ${LANGFUSE_SECRET_KEY:}
      public-key: ${LANGFUSE_PUBLIC_KEY:}
      url: ${LANGFUSE_BASE_URL:}

    # Milvus 向量数据库（Spring AI 自动读取这个配置连 Milvus）
    # 本地运行时连 localhost，Docker 容器里用环境变量覆盖成服务名 milvus-standalone
    vectorstore:
      milvus:
        host: localhost
        port: 19530
        database-name: default
        collection-name: "rag_docs"   # collection 名字，类似 MySQL 的表名
        embedding-dimension: 1024     # 向量维度，text-embedding-v3 实际输出 1024 维（默认 1536，必须改）
        initialize-schema: true       # 启动时自动创建 collection（类似 JPA 的 ddl-auto）

  # MySQL 数据源
  # password 用占位符，本地默认 123456，线上用环境变量注入
  datasource:
    # allowPublicKeyRetrieval=true：MySQL 8.0 默认用 caching_sha2_password 认证，需要这个参数才能连上
    url: jdbc:mysql://localhost:3306/liwx_learning?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # Redis（Sa-Token 的 token 存在这里）
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:123456}

# OpenTelemetry OTLP导出：把 Micrometer trace 发到 Langfuse
management:
  tracing:
    sampling:
      probability: 1.0  # 100% 采样，开发环境全量追踪
  otlp:
    tracing:
      endpoint: ${LANGFUSE_OTEL_ENDPOINT:https://jp.cloud.langfuse.com/api/otel/v1/traces}
      headers:
        Authorization: Basic ${LANGFUSE_OTEL_AUTH:}

# 高德天气 API（WeatherTool 用）
# 申请地址：https://lbs.amap.com/ → 控制台 → 应用管理 → 创建 Key（选 Web服务）
amap:
  api-key: ${AMAP_API_KEY:amap-placeholder}

# RAG 文档上传配置
rag:
  upload-dir: ./uploads  # 文件保存到项目根目录的 uploads 文件夹
  rerank:
    model: gte-rerank-v2  # 通义重排序模型，对检索结果按相关性重新打分排序
    min-score: 0.3        # 置信度门控阈值：Rerank 后 top1 分数低于此值判定为“检索没命中”，拒答防幻觉
                          # （防“检索到弱相关资料还硬答”）。分数不是概率，是相对值；宁低勿高——
                          # 设高会误杀该答的题。校准：跑批量评估看日志分数分布，想更严可调到 0.5
  query-rewrite:
    enabled: true          # 查询改写开关：检索前把口语化查询改写成多个规范变体分别检索（Multi-Query），
                          # 跑基线对比时设为 false 可回到单查询行为
    model: qwen-flash      # 改写用轻量模型：任务小、要求快和便宜，不值得动用主模型 qwen-plus
  # 语义缓存：问题→答案存 Milvus 独立 collection（SemanticCacheStore），
  # 相似度超阈值直接返回缓存答案：0 token、毫秒级响应（SemanticCacheAdvisor 短路 LLM 调用）
  semantic-cache:
    enabled: true
    similarity-threshold: 0.95  # 命中阈值：很高，只匹配“换个问法的同一个问题”，
                                # 多轮追问/相似但不同的问题不会误命中；想更激进可降到 0.90
    ttl-days: 7                 # 缓存有效期（天）：防止旧答案长期残留；文档上传/删除时会主动全量失效
  retry:
    max-attempts: 3       # 文档处理失败后的最大重试次数（含首次执行，3 = 最多试 3 次）
    delay-ms: 5000        # 重试间隔（毫秒），给 API 一点喘息时间避免连续打
  # 历史数据定时清理：超过保留期的会话四件套整删（消息+摘要+聊天图片+会话记录），不留孤儿
  # 触发在 HistoryCleanupTask（@Scheduled），逻辑在 SessionCleanupService
  cleanup:
    enabled: true                 # 本地开发不想删数据时设 false（任务照常调度但直接跳过）
    retain-days: 180              # 保留期：最后活跃时间早于 180 天前的会话删除（一段式全删）
    batch-size: 100               # 每批删除的会话数：分批防大事务（锁表/binlog 风暴）
    cron: "0 0 3 * * ?"           # 每天凌晨 3 点执行（Quartz 6 域：秒 分 时 日 月 周，低峰期）

# Graph 经营分析服务（graph-learning-java 项目）
# 本地开发默认 http://localhost:8081，Docker 部署时用环境变量覆盖
graph:
  service-url: ${GRAPH_SERVICE_URL:http://localhost:8081}

# 深度调研服务（Python LangGraph Agent 项目）
# 本地开发默认 http://localhost:8000，Docker 部署时用环境变量覆盖
research:
  service-url: ${RESEARCH_SERVICE_URL:http://localhost:8000}

# Sa-Token 配置
sa-token:
  token-name: satoken
  timeout: 2592000        # token 有效期 30 天（秒）
  is-concurrent: true      # 允许同一账号多设备同时登录
  is-share: false          # 不同设备生成不同的 token

# SpringDoc OpenAPI 配置（Knife4j 底层依赖）
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha          # 接口标签按字母排序
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.liwx.learning
  # 默认给所有接口加上 200 响应的 Result 包装说明
  override-with-generic-response: true

# Knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh_cn            # 中文界面

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.liwx.learning.user.entity,com.liwx.learning.rag.entity
  configuration:
    map-underscore-to-camel-case: true

# Resilience4j 熔断器配置（替代 ResilienceConfig.java 的 Java 配置）
# Spring Boot 自动读取这个配置，不需要再写 CircuitBreakerConfigCustomizer Bean
resilience4j:


  circuitbreaker:
    instances:
      researchCircuitBreaker:          # Python Agent 调研服务
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        recordExceptions:
          - java.lang.Exception
      weatherCircuitBreaker:           # 高德天气 API，WeatherTool 使用
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        recordExceptions:
          - java.lang.Exception
      mcpCircuitBreaker:               # MCP 远程工具调用
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        recordExceptions:
          - java.lang.Exception
      llmCircuitBreaker:               # LLM 主调用（通义千问），AiClientService 使用
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        recordExceptions:
          - java.lang.Exception
