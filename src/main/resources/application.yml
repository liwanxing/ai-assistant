spring:
  application:
    name: liwanxing-learning-projects

  # 文件上传限制：默认 1MB，PDF/Word 文档通常较大，调到 50MB
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # 环境配置：dev 开发 / prod 线上
  # 开发时默认 dev，线上启动时加 --spring.profiles.active=prod 覆盖
  profiles:
    active: dev

  # 导入本地敏感配置（不上传 git），文件不存在也不报错（optional）
  # 本地开发时在项目根目录放 application-local.yml，里面写真实的 API Key
  # 线上部署时用环境变量注入，不需要这个文件
  config:
    import: "optional:file:./application-local.yml"

  # Spring AI：用 OpenAI 兼容协议接通义 DashScope（chat + embedding 都走这个）
  # key 用占位符，真实值在 application-local.yml 或环境变量里
  #
  # 切换模型只需改下面的 model 名，不用动 Java 代码：
  #   qwen-plus → 通义千问、deepseek-r1 → DeepSeek、gpt-4o → OpenAI
  #   换平台还要改 base-url 和 api-key
  # AiConfig 里的 ChatClient.Builder 会自动读取这里的配置
  ai:
    openai:
      api-key: ${AI_API_KEY:sk-placeholder}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        model: qwen-plus            # 通义对话模型
      embedding:
        model: text-embedding-v3    # 通义向量模型，把文本转成向量（1024维）
    # ChatMemory 对话记忆：对话历史自动存 MySQL（SPRING_AI_CHAT_MEMORY 表）
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always  # MySQL 不是嵌入式数据库，默认不建表，必须设为 always
    # Milvus 向量数据库（Spring AI 自动读取这个配置连 Milvus）
    # 本地运行时连 localhost，Docker 容器里用环境变量覆盖成服务名 milvus-standalone
    vectorstore:
      milvus:
        host: localhost
        port: 19530
        database-name: default
        collection-name: "rag_docs"   # collection 名字，类似 MySQL 的表名
        embedding-dimension: 1024     # 向量维度，text-embedding-v3 实际输出 1024 维（默认 1536，必须改）
        initialize-schema: true       # 启动时自动创建 collection（类似 JPA 的 ddl-auto）

  # MySQL 数据源
  # password 用占位符，本地默认 123456，线上用环境变量注入
  datasource:
    # allowPublicKeyRetrieval=true：MySQL 8.0 默认用 caching_sha2_password 认证，需要这个参数才能连上
    url: jdbc:mysql://localhost:3306/liwx_learning?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # Redis（Sa-Token 的 token 存在这里）
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:123456}

# 高德天气 API（WeatherTool 用）
# 申请地址：https://lbs.amap.com/ → 控制台 → 应用管理 → 创建 Key（选 Web服务）
amap:
  api-key: ${AMAP_API_KEY:amap-placeholder}

# RAG 文档上传配置
rag:
  upload-dir: ./uploads  # 文件保存到项目根目录的 uploads 文件夹
  rerank:
    model: gte-rerank-v2  # 通义重排序模型，对检索结果按相关性重新打分排序
  retry:
    max-attempts: 3       # 文档处理失败后的最大重试次数（含首次执行，3 = 最多试 3 次）
    delay-ms: 5000        # 重试间隔（毫秒），给 API 一点喘息时间避免连续打

# Graph 经营分析服务（graph-learning-java 项目）
# 本地开发默认 http://localhost:8081，Docker 部署时用环境变量覆盖
graph:
  service-url: ${GRAPH_SERVICE_URL:http://localhost:8081}

# Sa-Token 配置
sa-token:
  token-name: satoken
  timeout: 2592000        # token 有效期 30 天（秒）
  is-concurrent: true      # 允许同一账号多设备同时登录
  is-share: false          # 不同设备生成不同的 token

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.liwx.learning.user.entity,com.liwx.learning.rag.entity
  configuration:
    map-underscore-to-camel-case: true
