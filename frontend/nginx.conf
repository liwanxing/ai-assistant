# Nginx 配置：前端静态托管 + API 反向代理
#
# 开发环境用 Vite 代理（vite.config.js），生产环境用 Nginx 代理
# 两者逻辑一样：/api 开头的请求转发到后端，去掉 /api 前缀

server {
    listen 80;

    # 前端静态文件
    location / {
        root /usr/share/nginx/html;
        # Vue Router history 模式：找不到的路径都回退到 index.html
        # 否则刷新页面会 404
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理：/api/login → app:8080/login
    # proxy_pass 末尾带 / 会去掉 /api 前缀（跟 Vite 的 rewrite 效果一样）
    location /api {
        proxy_pass http://app:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
