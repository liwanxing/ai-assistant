# ============================================================================
# 生产环境配置：所有服务容器化部署（app + mysql + redis + frontend）
# ----------------------------------------------------------------------------
# 使用方式：
#   # 首次启动 / 改代码后重新部署（自动构建镜像）
#   docker compose -f docker-compose.prod.yml up -d --build
#
#   # 只重启某个服务（不影响其他）
#   docker compose -f docker-compose.prod.yml up -d --build app
#
#   # 停止
#   docker compose -f docker-compose.prod.yml down
#
#   # 停止并清空数据（慎用）
#   docker compose -f docker-compose.prod.yml down -v
#
# 相比 docker-compose.yml（本地开发），这里多了：
#   - app 容器：Spring Boot 应用
#   - frontend 容器：Nginx + Vue 静态文件
#   - 容器间用服务名互相访问（app、mysql、redis、milvus-standalone），不用 localhost
# ============================================================================

services:

  # ==========================================================================
  # MySQL 8.0 数据库
  # ==========================================================================
  mysql:
    image: mysql:8.0
    container_name: mysql8
    ports:
      # 生产环境建议去掉这行（不暴露 DB 到宿主机），这里保留方便用 DBeaver 连接排查
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: liwx_learning
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      # 初始化脚本：MySQL 官方镜像按文件名字母序执行
      - ./sql/rbac.sql:/docker-entrypoint-initdb.d/01-rbac.sql:ro
      - ./sql/rag.sql:/docker-entrypoint-initdb.d/02-rag.sql:ro
      - ./sql/graph.sql:/docker-entrypoint-initdb.d/03-graph.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --character-set-client-handshake=FALSE
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ==========================================================================
  # Redis 7 缓存（Sa-Token 的 token 存储在这里）
  # ==========================================================================
  redis:
    image: redis:7
    container_name: redis7
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    command: ["redis-server", "--requirepass", "123456"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ==========================================================================
  # Milvus 2.4 向量数据库（RAG 模块用，存向量 + chunk 原文）
  # ==========================================================================
  # Milvus standalone 是"三件套"：milvus（检索引擎）+ etcd（元数据）+ minio（数据存储）
  # milvus 只管运算，数据存 minio，配置存 etcd；etcd/minio 是内部依赖，不用直接操作
  milvus-standalone:
    image: milvusdb/milvus:v2.4.6
    container_name: milvus-standalone
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"   # gRPC 端口，Spring AI 通过这个连 Milvus
      - "9091:9091"     # 健康检查 / metrics 端口
    environment:
      ETCD_ENDPOINTS: etcd:2379        # 告诉 milvus 去 etcd:2379 读元数据
      MINIO_ADDRESS: minio:9000        # 告诉 milvus 去 minio:9000 读写数据
      TZ: Asia/Shanghai
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy      # 等 etcd 真正就绪再启动
      minio:
        condition: service_healthy      # 等 minio 真正就绪再启动
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s   # Milvus 启动较慢，给 90 秒预热（这期间失败不计入 retries）
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # etcd：键值存储，存 Milvus 的元数据（有哪些 collection、schema 定义等）
  # Milvus 的内部依赖，你不用直接操作它
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
      - TZ=Asia/Shanghai
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # minio：对象存储（简化版 S3），存 Milvus 的向量数据文件
  # Milvus 的内部依赖，你不用直接操作它
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      TZ: Asia/Shanghai
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ==========================================================================
  # Spring Boot 应用
  # ==========================================================================
  app:
    # 同时声明 build 和 image：
    #   - build：docker compose up --build 时按 Dockerfile 构建镜像
    #   - image：构建出的镜像打上这个 tag，方便 docker 命令单独引用
    build:
      context: .
      dockerfile: Dockerfile
    image: liwanxing-learning-projects-app:latest
    container_name: app
    ports:
      - "8080:8080"
    # 关键：condition: service_healthy 让 app 等 mysql/redis 真正就绪后再启动
    # 只用 depends_on（不带 condition）只会等容器"启动"，不等"就绪"，会连不上
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus-standalone:
        condition: service_healthy   # 等 Milvus 真正就绪再启动，否则 RAG 初始化会失败
    environment:
      # 用 Docker 服务名替换 localhost（容器间通过 Docker 内部 DNS 互访）
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/liwx_learning?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "123456"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: "123456"
      # Milvus 连接：容器间用服务名 milvus-standalone，不用 localhost
      SPRING_AI_VECTORSTORE_MILVUS_HOST: milvus-standalone
      SPRING_AI_VECTORSTORE_MILVUS_PORT: "19530"
      # 通义 DashScope API Key（部署时改成你自己的）
      AI_API_KEY: "sk-你的线上key"
      # 激活 prod profile：日志降到 INFO（logback-spring.xml 里的 prod 段才生效）
      # 不设这个的话默认走 dev，线上会一直打 DEBUG 日志
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
    volumes:
      # 日志持久化：logback 写到 /app/logs，挂到命名卷，容器重建日志不丢
      - app_logs:/app/logs
    # init: true 让容器用 init 进程（PID 1）托管 Java 进程
    # 好处：docker stop 时能正确转发 SIGTERM，应用优雅关闭，不会僵死
    init: true
    restart: unless-stopped

  # ==========================================================================
  # 前端（Nginx + Vue 静态文件）
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: liwanxing-learning-projects-frontend:latest
    container_name: frontend
    ports:
      - "8081:80"
    depends_on:
      - app   # 前端只是反向代理到 app，不需要等 app 健康也能启动
    environment:
      TZ: Asia/Shanghai
    restart: unless-stopped

# ===========================================================================
# 命名卷
#   mysql_data / redis_data：数据库与缓存数据持久化
#   milvus_data / etcd_data / minio_data：向量数据库及其依赖的数据持久化
#   app_logs：应用日志持久化，容器重建后历史日志仍可查
# ===========================================================================
volumes:
  mysql_data:
  redis_data:
  milvus_data:
  etcd_data:
  minio_data:
  app_logs:
