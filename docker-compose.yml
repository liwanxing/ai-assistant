# ============================================================================
# 本地开发环境配置：只启动 MySQL + Redis
# ----------------------------------------------------------------------------
# 使用方式：
#   docker compose up -d            启动 MySQL + Redis
#   docker compose down             停止并删除容器（数据保留在命名卷里）
#   docker compose down -v          停止并删除容器 + 清空数据卷（重置数据库）
#
# 设计思路（混合部署）：
#   数据库 / 缓存  → Docker 容器（环境一致，不用本地装 MySQL/Redis）
#   后端           → IDEA 里直接跑 LearningApplication（断点调试、实时日志）
#   前端           → npm run dev（Vite 热更新，改代码自动刷新）
#   这样既享受容器的环境隔离，又保留本地开发的调试体验。
#
# 与 docker-compose.prod.yml 的区别：
#   - 这里只有 2 个服务，prod 有 4 个（多了 app 和 frontend）
#   - 这里不跑 Spring Boot 容器，因为本地 IDEA 调试更方便
# ============================================================================

services:

  # ==========================================================================
  # MySQL 8.0 数据库
  # ==========================================================================
  mysql:
    image: mysql:8.0
    container_name: mysql8
    ports:
      - "3306:3306"   # 暴露给宿主机，IDEA/DBeaver 可连 localhost:3306
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: liwx_learning      # 容器启动时自动创建这个库
      TZ: Asia/Shanghai                   # 容器时区，让日志时间与本地一致
    volumes:
      # 数据持久化：把 /var/lib/mysql 存到命名卷，down 容器数据不丢
      - mysql_data:/var/lib/mysql
      # 初始化脚本：容器首次启动时自动执行（仅首次，已有数据卷时跳过）
      - ./sql/rbac.sql:/docker-entrypoint-initdb.d/rbac.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --character-set-client-handshake=FALSE
    # 健康检查：docker 据此判断 MySQL 是否"真正就绪"（能响应连接）
    # mysqladmin ping 返回 0 表示可连，配合 app 的 condition: service_healthy 用
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD", "--silent"]
      interval: 10s       # 每 10 秒检查一次
      timeout: 5s         # 单次检查超时时间
      retries: 10         # 最多重试 10 次才判定为 unhealthy
      start_period: 30s   # 启动后 30 秒内失败不计入 retries（给初始化留时间）
    restart: unless-stopped

  # ==========================================================================
  # Redis 7 缓存（Sa-Token 的 token 存储在这里）
  # ==========================================================================
  redis:
    image: redis:7
    container_name: redis7
    ports:
      - "6379:6379"   # 暴露给宿主机，本地连 localhost:6379
    environment:
      TZ: Asia/Shanghai
    command: ["redis-server", "--requirepass", "123456"]
    volumes:
      # 数据持久化：token / 缓存数据存到命名卷，重启不丢
      - redis_data:/data
    # 健康检查：redis-cli ping 能返回 PONG 说明 Redis 可用
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ==========================================================================
  # Milvus 2.4 向量数据库（RAG 模块用，存向量 + chunk 原文）
  # ==========================================================================
  # Milvus standalone 是"三件套"：milvus（检索引擎）+ etcd（元数据）+ minio（数据存储）
  # milvus 只管运算，数据存 minio，配置存 etcd；etcd/minio 是内部依赖，不用直接操作
  milvus-standalone:
    image: milvusdb/milvus:v2.4.6
    container_name: milvus-standalone
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"   # gRPC 端口，Spring AI 通过这个连 Milvus
      - "9091:9091"     # 健康检查 / metrics 端口
    environment:
      ETCD_ENDPOINTS: etcd:2379        # 告诉 milvus 去 etcd:2379 读元数据
      MINIO_ADDRESS: minio:9000        # 告诉 milvus 去 minio:9000 读写数据
      TZ: Asia/Shanghai
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy      # 等 etcd 真正就绪再启动
      minio:
        condition: service_healthy      # 等 minio 真正就绪再启动
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s   # Milvus 启动较慢，给 90 秒预热（这期间失败不计入 retries）
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # etcd：键值存储，存 Milvus 的元数据（有哪些 collection、schema 定义等）
  # Milvus 的内部依赖，你不用直接操作它
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
      - TZ=Asia/Shanghai
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # minio：对象存储（简化版 S3），存 Milvus 的向量数据文件
  # Milvus 的内部依赖，你不用直接操作它
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      TZ: Asia/Shanghai
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    restart: unless-stopped

# ===========================================================================
# 命名卷：由 Docker 管理，存在 Docker 默认数据目录里
#   - docker compose down       → 容器删除，卷保留（数据还在）
#   - docker compose down -v    → 容器 + 卷一起删（彻底重置）
# ===========================================================================
volumes:
  mysql_data:
  redis_data:
  milvus_data:
  etcd_data:
  minio_data:
