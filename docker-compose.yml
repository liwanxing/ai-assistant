services:
  mysql:
    image: mysql:8.0
    container_name: mysql8
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: liwx_learning
    volumes:
      - ./sql/rbac.sql:/docker-entrypoint-initdb.d/rbac.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7
    container_name: redis7
    ports:
      - "6379:6379"
    command: --requirepass 123456
